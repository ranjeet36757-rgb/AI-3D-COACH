name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Gradle 8.6
      run: |
        gradle wrapper --gradle-version 8.6
        chmod +x gradlew

    # असली और वेरिफाइड 3D ह्यूमन मॉडल डाउनलोड करना
    - name: Auto-Download 3D Model
      run: |
        mkdir -p app/src/main/assets/models
        curl -fSL -o app/src/main/assets/models/human_body.glb "https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/CesiumMan/glTF-Binary/CesiumMan.glb" || \
        curl -fSL -o app/src/main/assets/models/human_body.glb "https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/CesiumMan/glTF-Binary/CesiumMan.glb"
        ls -lh app/src/main/assets/models/human_body.glb

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: AI-3D-Coach-App
        path: app/build/outputs/apk/debug/*.apk
